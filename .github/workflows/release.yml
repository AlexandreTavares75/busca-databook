name: Build e Release

# Gera o instalador a cada tag vX.Y.Z e publica na aba Releases.
# "Run workflow" manual gera o instalador como artefato, sem publicar.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # necessario apenas para criar a release
    env:
      # SHA-256 do por.traineddata (tessdata_fast 4.1.0). Na 1a execucao deixe vazio:
      # o log mostra o valor; copie-o para ca para travar o arquivo nas proximas.
      POR_TRAINEDDATA_SHA256: ""
      POR_TRAINEDDATA_URL: "https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/por.traineddata"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir versão
        id: versao
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); import versao; print(versao.VERSAO)"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSAO inválida em src/versao.py: '$v'" }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$v") {
            throw "A tag '$($env:REF_NAME)' não corresponde a src/versao.py (v$v)."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "versao=$v"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Gerar executável (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name BuscaDatabook
          --paths src --collect-all pypdfium2 --collect-all docx --collect-all pptx
          --hidden-import win32com.client --add-data "assets/logo.png;assets" src/app.py

      - name: Preparar Tesseract OCR + Português
        run: |
          choco install tesseract -y --no-progress
          $origem = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$origem\tesseract.exe")) { throw "Tesseract não encontrado em $origem" }
          New-Item -ItemType Directory -Force -Path vendor\tesseract | Out-Null
          Copy-Item -Path "$origem\*" -Destination vendor\tesseract -Recurse -Force -Exclude "unins*"

          $por = "vendor\tesseract\tessdata\por.traineddata"
          Invoke-WebRequest -Uri $env:POR_TRAINEDDATA_URL -OutFile $por
          $h = (Get-FileHash $por -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256 por.traineddata: $h"
          if ($env:POR_TRAINEDDATA_SHA256) {
            if ($h -ne $env:POR_TRAINEDDATA_SHA256.ToLower()) { throw "SHA-256 do por.traineddata não confere!" }
          } else {
            Write-Host "::warning::Fixe POR_TRAINEDDATA_SHA256: '$h' no workflow para travar este arquivo."
          }

          $langs = & vendor\tesseract\tesseract.exe --list-langs 2>&1 | Out-String
          Write-Host $langs
          if ($langs -notmatch '(?m)^por\s*$') { throw "Idioma 'por' não carregou no Tesseract embutido." }

      - name: Gerar instalador (Inno Setup)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSAO" installer\BuscaDatabook.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Calcular SHA-256
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $nome = "BuscaDatabook-Setup-$env:VERSAO.exe"
          $arq = Join-Path $PWD "output\$nome"
          $h = (Get-FileHash $arq -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$arq.sha256", "$h  $nome`n", [Text.Encoding]::ASCII)
          Write-Host "$h  $nome"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ steps.versao.outputs.versao }}
          path: output/
          if-no-files-found: error

      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $exe = "output\BuscaDatabook-Setup-$env:VERSAO.exe"
          gh release create $env:TAG $exe "$exe.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Busca Databook $env:VERSAO" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a release" }